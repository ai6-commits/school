<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관용표현 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">

    <!-- 메인 화면 -->
    <section id="screen-start" class="screen active" aria-labelledby="start-title">
      <div class="emoji" aria-hidden="true">📚</div>
      <h1 id="start-title">관용표현 퀴즈</h1>
      <p class="sub">7문제 · 4지선다 · 100점 만점</p>
      <p class="desc">우리가 자주 쓰는 관용표현의 진짜 뜻을 맞혀 보세요!</p>
      <button id="btn-start" class="btn primary big" type="button">시작하기</button>
    </section>

    <!-- 문제 화면 -->
    <section id="screen-quiz" class="screen" aria-labelledby="question-text">
      <div class="progress-wrap">
        <span id="progress-label" class="progress-label">1 / 7</span>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="1">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <h2 id="question-text" class="question"></h2>
      <ul id="choices" class="choices" role="radiogroup" aria-labelledby="question-text"></ul>

      <div class="nav">
        <button id="btn-prev" class="btn" type="button">이전</button>
        <button id="btn-next" class="btn primary" type="button" disabled>다음</button>
        <button id="btn-submit" class="btn primary" type="button" disabled hidden>최종 제출</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" aria-labelledby="result-title">
      <h2 id="result-title" class="result-title">결과</h2>
      <div class="score-box">
        <span id="score" class="score">0</span><span class="score-unit">점</span>
      </div>
      <p id="result-msg" class="result-msg"></p>
      <p id="result-count" class="result-count"></p>

      <ul id="summary" class="summary" aria-label="문제별 결과"></ul>

      <div id="wrong-section" class="wrong-section">
        <h3>틀린 문제 확인하기</h3>
        <ul id="wrong-list" class="wrong-list"></ul>
      </div>
      <p id="perfect-msg" class="perfect-msg" hidden>🎉 모두 정답이에요! 틀린 문제가 없어요.</p>

      <button id="btn-retry" class="btn primary big" type="button">다시 풀기</button>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
